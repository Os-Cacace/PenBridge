# VoodooI2CHID patch table for pentool.sh. See CLAUDE.md for what each patch does
# and how to add a block for another VoodooI2C version.
#
# build <md5 of the original VoodooI2CHID binary> <md5 after every patch below> <label>
# patch <file offset, hex> <original bytes, hex> <new bytes, hex> <description>
